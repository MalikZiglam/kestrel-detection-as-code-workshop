id: privileged-auth-success-after-failures

title: Privileged account login after multiple failed attempts

status: production

owner: team-05

deployment:
  enabled: true

description: >
  Detects successful authentication of a privileged account after
  multiple failed authentication attempts from the same source within
  the enrichment window.

business_rationale: >
  A successful login after repeated failures may indicate password
  guessing, credential stuffing, or brute force activity that
  ultimately succeeded against a privileged account.

evidence_refs:
  - logs/authentication/README.md

telemetry_requirements:
  - authentication events containing event.action
  - authentication.privileged enrichment
  - workshop.enrichment.failed_logins_same_source_5m enrichment

tuning_notes:
  problem: >
    Low thresholds can generate noise during normal user behaviour.
  recommended_tuning: >
    Keep the threshold at 5 or greater and focus on privileged accounts.
  rollback: >
    Disable deployment.enabled if false positives become excessive.

severity: high

log_source: identity

query: >
  event.category:authentication
  and event.action:authentication_success
  and authentication.privileged:true
  and workshop.enrichment.failed_logins_same_source_5m:>=5

mitre_attack:
  tactics:
    - TA0006
  techniques:
    - T1110
    - T1078
  subtechniques: []

detection_strategy:
  ids: []

data_components:
  ids:
    - user-account-authentication

false_positives:
  - User repeatedly mistypes password before successful login.
  - Administrator using outdated stored credentials before correction.

known_exceptions: []

investigation_guidance: >
  Review source.ip, user.name, prior authentication failures,
  geolocation, and recent privileged activity. Confirm whether the
  login originated from a trusted device and expected location.

tags:
  - identity
  - authentication
  - privileged
  - brute-force
  - credential-access

test_cases:
  positive:
    - tests/team-05/positive/admin_success_after_failures.ndjson
  negative:
    - tests/team-05/negative/admin_normal_login.ndjson
    - tests/team-05/negative/non_privileged_success.ndjson

review_date: 2026-12-01
