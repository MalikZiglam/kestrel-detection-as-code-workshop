name: Successful Privileged Authentication After Multiple Failures
id: auth-success-after-failures-admin

status: production
owner: leon.rohde

description: >
  Detects a successful authentication of a privileged account after
  multiple failed authentication attempts from the same source.

severity: high

review_date: 2026-12-31

deployment:
  enabled: true

log_source:
  product: custom
  service: identity-provider
  dataset: authentication

mitre_attack:
  tactics:
    - Credential Access
    - Persistence
  techniques:
    - T1110
    - T1078

query: |
  event.action = "authentication_success"
  AND authentication.privileged = true
  AND workshop.enrichment.failed_logins_same_source_5m >= 5

test_cases:
  positive:
    - name: Admin login after brute force
      event:
        "@timestamp": "2024-11-12T08:05:09Z"
        event.action: "authentication_success"
        authentication.privileged: true
        workshop.enrichment.failed_logins_same_source_5m: 6

  negative:
    - name: Normal MFA admin login
      event:
        "@timestamp": "2024-11-12T07:31:44Z"
        event.action: "authentication_success"
        authentication.privileged: true
        workshop.enrichment.failed_logins_same_source_5m: 0

    - name: Non privileged user success
      event:
        "@timestamp": "2024-11-12T07:56:40Z"
        event.action: "authentication_success"
        authentication.privileged: false
        workshop.enrichment.failed_logins_same_source_5m: 2
