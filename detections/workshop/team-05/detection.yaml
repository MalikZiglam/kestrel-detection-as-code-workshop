id: privileged-auth-success-after-failures

title: Privileged account login after multiple failed attempts

status: production

owner: team-05

deployment:
  enabled: true

description: >
  Detects successful authentication of a privileged account.

business_rationale: >
  Privileged account access represents a higher risk than standard user
  authentication and should be monitored to identify potentially
  suspicious activity.

evidence_refs:
  - logs/authentication/README.md

telemetry_requirements:
  - authentication events with event.action
  - authentication.privileged enrichment

tuning_notes:
  problem: >
    Monitoring all privileged logins can generate analyst workload.
  recommended_tuning: >
    Consider adding enrichment-based thresholds or source IP filtering if
    supported by the query language.
  rollback: >
    Set deployment.enabled to false if excessive alert volume is observed.

severity: medium

log_source: identity

query: >
  event.category: authentication
  and event.action: authentication_success
  and authentication.privileged: true

mitre_attack:
  tactics:
    - TA0006
  techniques:
    - T1078
  subtechniques: []

detection_strategy:
  ids: []

data_components:
  ids:
    - user-account-authentication

false_positives:
  - Legitimate administrator logins.
  - Scheduled privileged operational activities.

known_exceptions: []

investigation_guidance: >
  Review source.ip, authentication.method, user.name, and recent login
  history to determine whether the activity is expected.

tags:
  - identity
  - authentication
  - privileged

test_cases:
  positive:
    - tests/workshop/team-05/positive.ndjson
  negative:
    - tests/workshop/team-05/negative.ndjson

review_date: 2026-12-01
