id: team04-draft-detection

title: Successful Login After Multiple Failed Authentication Attempts

status: draft

owner: team-04

deployment:
  enabled: false

description: >
 Detects successful authentication events that occur after multiple failed authentication attempts from the same source IP address within a five-minute
period. This behavior may indicate a successful brute-force attack or password guessing activity.

business_rationale: >
 Successful authentication following repeated login failures can signal that
an attacker successfully guessed valid credentials. Early detection helps
identify compromised accounts and reduces the risk of unauthorized access,
privilege abuse, and lateral movement.

evidence_refs:
- evidence/team-04-authentication-logs.ndjson

telemetry_requirements: 
- authentication logs
- event.outcome
- source.ip
- user.name
- workshop.enrichment.failed_logins_same_source_5m

severity: high

log_source: identity

query: >
event.category: authentication
and event.outcome: success
and workshop.enrichment.failed_logins_same_source_5m >= 5

mitre_attack:
  tactics: [Credential Access]
  techniques: [T1110]
  subtechniques: []

detection_strategy:
  ids: [DS0015]

data_components:
  ids: []

false_positives: 
- User successfully authenticates after multiple mistyped passwords
- Shared accounts with multiple concurrent login attempts
- Password manager synchronization issues
- Authentication infrastructure latency or retries

known_exceptions:
- Approved password reset exercises
- Security team credential testing

investigation_guidance: >
  Describe what an analyst should inspect after this rule generates an alert.

tags:
  - workshop
  - team-04
  - brute-force
- credential-access
- attack.t1110

test_cases:
  positive:
    - tests/workshop/team-04/positive.ndjson
  negative:
    - tests/workshop/team-04/negative.ndjson

review_date: "2026-12-31"
