# =============================================================================
# TEAM 01 — DETECTION WORKSPACE
# =============================================================================

id: team01-logging-pipeline-interference

title: Logging Pipeline Interference

status: test

owner: team-01

deployment:
  enabled: true

description: >
  Detects a cloud control-plane operation that stops a log stream feeding the
  security monitoring pipeline.

business_rationale: >
  Stopping a security log stream creates a visibility gap in which subsequent
  attacker activity may go unobserved, delaying detection and investigation.

evidence_refs:
  - evidence/threat-brief.md
  - evidence/pentest-purple-team-findings.md

telemetry_requirements:
  - cloud.api_operation
  - cloud.resource.type
  - cloud.actor.principal

severity: high

log_source: cloud

query: >
  cloud.api_operation: "StopLogStream"
  and cloud.resource.type: "log_stream"

mitre_attack:
  tactics: []
  techniques: []
  subtechniques: []

detection_strategy:
  ids: []

data_components:
  ids: []

false_positives:
  - Authorized maintenance or troubleshooting that temporarily stops a logging stream.
  - Approved administrative changes to the logging pipeline.

known_exceptions: []

investigation_guidance: >
  Identify the principal recorded in cloud.actor.principal and verify whether
  the StopLogStream operation was authorized. Review the targeted resource,
  related cloud control-plane activity, subsequent changes by the same
  principal, and activity occurring during the resulting logging gap.

tags:
  - workshop
  - team-01
  - cloud
  - logging
  - defense-evasion

test_cases:
  positive:
    - tests/workshop/team-01/positive.ndjson
  negative:
    - tests/workshop/team-01/negative.ndjson

review_date: "2026-12-31"
