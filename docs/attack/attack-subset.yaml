# =============================================================================
# PINNED MITRE ATT&CK SUBSET  (local, offline, deterministic)  — WORKSHOP_SPEC §15
# =============================================================================
# WHY THIS FILE EXISTS
#   Static CI must not depend on live Internet lookups during the workshop.
#   This is a PINNED, LOCAL subset of ATT&CK Enterprise covering only the
#   tactics, techniques, and sub-techniques relevant to the 8 workshop
#   candidate classes and the 6 baseline example rules.
#
# WHAT THE VALIDATOR CHECKS AGAINST THIS FILE  (deterministic only)
#   The L2 semantic check answers ONE binary question per ATT&CK id in a
#   detection's `mitre_attack` block:
#       "Does this Txxxx / Txxxx.yyy / TAxxxx exist in the pinned set?"
#   It does NOT judge whether the mapping is CORRECT for the rule's logic.
#   "Is this the right technique for this detection?" is a human / AI-review
#   question (see docs/mitre-guide.md and WORKSHOP_SPEC §19.1 vs §19.3).
#
# SCOPE
#   Enterprise matrix only. IDs and names below are real ATT&CK identifiers.
#   Coverage is deliberately narrow: the 8 candidate classes plus the baseline
#   catalogue. It is not the full framework.

meta:
  framework: "MITRE ATT&CK for Enterprise"
  attack_version: "v16.1"          # pinned release this subset was authored from;
                                   # intentional pin, NOT a claim to be the current
                                   # release. Existence checks run against this version.
  pinned_on: "2026-09-16"          # date this local subset was pinned
  source: "https://attack.mitre.org (offline snapshot; not fetched at CI time)"
  determinism_note: >
    CI checks id EXISTENCE in this file only. Mapping CORRECTNESS is a
    human/AI-review judgment, never a deterministic CI gate.
  candidate_classes:
    - "1: management-plane / trust-plane crossing (lateral movement)"
    - "2: failed-then-success auth burst (credential access)"
    - "3: logging impairment (stop/disable log stream)"
    - "4: IAM change / privilege grant"
    - "5: Tier-1 application access abuse"
    - "6: bulk outbound transfer (exfiltration)"
    - "7: secrets-management audit  (NON-DETECTABLE — telemetry gap, no ATT&CK map required)"
    - "8: noisy service-account authentication"

